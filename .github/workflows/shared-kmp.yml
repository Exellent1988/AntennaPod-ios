name: Shared KMP

on:
  pull_request:
    paths:
      - "shared/kmp/**"
      - "shared/specs/**"
      - ".github/workflows/shared-kmp.yml"
  push:
    branches: [ master, develop ]
    paths:
      - "shared/kmp/**"
      - "shared/specs/**"
      - ".github/workflows/shared-kmp.yml"

jobs:
  jvm-test:
    name: "KMP JVM Test"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: shared-kmp-${{ hashFiles('shared/kmp/**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: JVM tests
        run: ./gradlew -p shared/kmp jvmTest
